# ============================================================================
# Profil SECURE — DPI Service avec Keycloak OAuth2/JWT
# Démarrage local : mvn spring-boot:run -Dspring-boot.run.profiles=secure
# Datasource : application.yml (H2) ou application-prod.yml (PostgreSQL).
# ============================================================================
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ehealth}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/ehealth/protocol/openid-connect/certs}

server:
  port: 8083

logging:
  level:
    com.sih.dpi: DEBUG
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
