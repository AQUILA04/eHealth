spring:
  application:
    name: dpi-service
  profiles:
    active: mock

  datasource:
    url: jdbc:h2:mem:dpidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8083
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sih.dpi: DEBUG
    org.springframework.web: INFO

# Référence vers le GAP service
# Surcharge via variable d'environnement GAP_SERVICE_URL en Docker
gap:
  service:
    url: ${GAP_SERVICE_URL:http://localhost:8082}
