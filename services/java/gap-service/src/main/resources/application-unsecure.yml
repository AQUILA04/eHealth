# ============================================================================
# Profil UNSECURE — GAP Service sans authentification
# Démarrage : mvn spring-boot:run -Dspring-boot.run.profiles=unsecure
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:gapdb_unsecure;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

logging:
  level:
    com.sih.gap: DEBUG
