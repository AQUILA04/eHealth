# ============================================================================
# Profil SECURE — GAP Service avec Keycloak OAuth2/JWT
# Démarrage local : mvn spring-boot:run -Dspring-boot.run.profiles=secure
# Ne pas y mettre de datasource : H2 reste dans application.yml (dev),
# PostgreSQL dans application-prod.yml. Un datasource H2 ici cassait la prod
# (profils secure,prod) : Hibernate gardait H2Dialect / user sa.
# ============================================================================
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ehealth}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/ehealth/protocol/openid-connect/certs}

server:
  port: 8082

logging:
  level:
    com.sih.gap: DEBUG
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
