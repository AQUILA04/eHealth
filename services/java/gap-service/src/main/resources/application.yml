spring:
  application:
    name: gap-service
  profiles:
    active: mock

  datasource:
    url: jdbc:h2:mem:gapdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sih.gap: DEBUG
    org.springframework.web: INFO

# URL du mock EMPI — utilisé par le client REST interne
# Surcharge via variable d'environnement EMPI_SERVICE_URL en Docker
empi:
  service:
    url: ${EMPI_SERVICE_URL:http://localhost:8081}

tenant:
  service:
    url: ${TENANT_SERVICE_URL:http://localhost:8084}
  internal-api-key: ${TENANT_INTERNAL_API_KEY:ehealth-internal-dev-key}
  quota:
    enabled: ${TENANT_QUOTA_ENABLED:true}
