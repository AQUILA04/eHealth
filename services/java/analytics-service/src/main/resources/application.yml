spring:
  application:
    name: analytics-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  datasource:
    url: jdbc:h2:mem:analytics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
server:
  port: ${SERVER_PORT:8092}
management:
  endpoints:
    web:
      exposure:
        include: health,info
