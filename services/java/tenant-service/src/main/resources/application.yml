spring:
  application:
    name: tenant-service
  profiles:
    active: mock

  datasource:
    url: jdbc:h2:mem:tenantdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

tenant:
  service:
    url: ${TENANT_SERVICE_URL:http://localhost:8084}
  internal-api-key: ${TENANT_INTERNAL_API_KEY:ehealth-internal-dev-key}

server:
  port: 8084
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sih.tenant: DEBUG
    org.springframework.web: INFO
