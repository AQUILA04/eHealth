# ============================================================================
# Profil SECURE — Tenant Service avec Keycloak OAuth2/JWT
# Datasource : application.yml (H2) ou application-prod.yml (PostgreSQL).
# ============================================================================
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ehealth}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/ehealth/protocol/openid-connect/certs}

server:
  port: 8084

logging:
  level:
    com.sih.tenant: DEBUG
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
