spring:
  application:
    name: empi-service
  profiles:
    active: mock

  # H2 in-memory — profil mock (développement)
  datasource:
    url: jdbc:h2:mem:empidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sih.empi: DEBUG
    org.springframework.web: INFO

empi:
  mock:
    enabled: true
  matching:
    # Seuil de similarité pour la déduplication probabiliste (0.0 – 1.0)
    similarity-threshold: 0.85
