spring:
  application:
    name: support-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  datasource:
    url: jdbc:h2:mem:supportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/ehealth/protocol/openid-connect/certs}
server:
  port: ${SERVER_PORT:8090}
management:
  endpoints:
    web:
      exposure:
        include: health,info
