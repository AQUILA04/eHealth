spring:
  application: { name: patient-portal-service }
  profiles: { active: ${SPRING_PROFILES_ACTIVE:mock} }
  datasource: { url: jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1, driver-class-name: org.h2.Driver, username: sa }
  jpa: { hibernate: { ddl-auto: create-drop }, open-in-view: false }
server: { port: ${SERVER_PORT:8091} }
management: { endpoints: { web: { exposure: { include: health,info } } } }
