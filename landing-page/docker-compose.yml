# eHealth product landing — Host via LANDING_HOST (default ehealth.optimizesolux.com)
# Requires shared Traefik + network traefik-public on the Contabo VPS.
#
# Deploy:
#   docker compose --project-name ehealth-landing up -d --build

services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ehealth-landing:latest
    container_name: ehealth-landing
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.ehealth-landing.rule=Host(`${LANDING_HOST:-ehealth.optimizesolux.com}`)"
      - "traefik.http.routers.ehealth-landing.entrypoints=websecure"
      - "traefik.http.routers.ehealth-landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ehealth-landing.priority=10"
      - "traefik.http.services.ehealth-landing.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
