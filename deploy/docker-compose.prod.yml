# PROD stack — project name: ehealth-prod
# Host (OptimizeSolux convention):
#   ehealth.optimizesolux.com  → frontend (Nginx proxy /api/v1/* → APIs)
# Auth (shared common-infra):
#   auth.optimizesolux.com/realms/ehealth
#
# Prerequisite: optimize-common-infra running (keycloak on optimizesolux-common)
#               + shared-traefik on traefik-public.
# Start:
#   docker compose -f docker-compose.prod.yml --project-name ehealth-prod \
#     --env-file /opt/ehealth/prod/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ehealth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ehealth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ehealth} -d ${DB_NAME:-ehealth} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      optimizesolux-common:
        aliases: ["ehealth-db"]

  empi-service:
    image: ${EMPI_IMAGE:?EMPI_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehealth_empi
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_HIKARI_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED_ENUM_JDBC_TYPE: VARCHAR
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      EMPI_MATCHING_SIMILARITY_THRESHOLD: "0.85"
      OTEL_SERVICE_NAME: ehealth-empi
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    networks:
      - optimizesolux-common
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  gap-service:
    image: ${GAP_IMAGE:?GAP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      empi-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod,secure
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehealth_gap
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_HIKARI_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED_ENUM_JDBC_TYPE: VARCHAR
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      EMPI_SERVICE_URL: http://empi-service:8081
      KEYCLOAK_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.optimizesolux.com/realms/ehealth}
      KEYCLOAK_JWK_URI: ${OIDC_JWK_URI:-https://auth.optimizesolux.com/realms/ehealth/protocol/openid-connect/certs}
      OTEL_SERVICE_NAME: ehealth-gap
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    networks:
      - optimizesolux-common
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  dpi-service:
    image: ${DPI_IMAGE:?DPI_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gap-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod,secure
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehealth_dpi
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_HIKARI_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED_ENUM_JDBC_TYPE: VARCHAR
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      GAP_SERVICE_URL: http://gap-service:8082
      KEYCLOAK_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.optimizesolux.com/realms/ehealth}
      KEYCLOAK_JWK_URI: ${OIDC_JWK_URI:-https://auth.optimizesolux.com/realms/ehealth/protocol/openid-connect/certs}
      OTEL_SERVICE_NAME: ehealth-dpi
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    networks:
      - optimizesolux-common
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  tenant-service:
    image: ${TENANT_IMAGE:?TENANT_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,secure
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ehealth_tenant
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_USERNAME: ${DB_USER:-ehealth}
      SPRING_DATASOURCE_HIKARI_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED_ENUM_JDBC_TYPE: VARCHAR
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      KEYCLOAK_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.optimizesolux.com/realms/ehealth}
      KEYCLOAK_JWK_URI: ${OIDC_JWK_URI:-https://auth.optimizesolux.com/realms/ehealth/protocol/openid-connect/certs}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ehealth}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      OTEL_SERVICE_NAME: ehealth-tenant
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    networks:
      - optimizesolux-common
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      empi-service:
        condition: service_healthy
      gap-service:
        condition: service_healthy
      dpi-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    networks:
      - optimizesolux-common
      - traefik-public
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.ehealth-prod-frontend.rule=Host(`${APP_HOSTNAME:-ehealth.optimizesolux.com}`)"
      - "traefik.http.routers.ehealth-prod-frontend.entrypoints=websecure"
      - "traefik.http.routers.ehealth-prod-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ehealth-prod-frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:

networks:
  optimizesolux-common:
    external: true
  traefik-public:
    external: true
