# ============================================================================
# eHealth — Docker Compose Développement
#
# Démarre l'ensemble de la stack en une commande depuis la racine du monorepo :
#
#   docker compose -f infrastructure/docker/docker-compose.dev.yml up --build
#
# Services inclus :
#   keycloak-db   — PostgreSQL 16 pour Keycloak
#   keycloak      — IAM/SSO avec import automatique du realm ehealth
#   empi-service   — Mock EMPI (port 8081)
#   gap-service    — Module I — Gestion Administrative du Patient (port 8082)
#   dpi-service    — Module II — Dossier Patient Informatisé (port 8083)
#   tenant-service — Multi-tenant admin (port 8084)
#   lis-service    — Module III, laboratoire et banque de sang (port interne 8085)
#   ris-service    — Module III, radiologie (port interne 8086)
#   pharmacy-service — Module IV, pharmacie et stocks (port interne 8087)
#   api-gateway    — Point d’entrée API tenant-sécurisé (port interne 3000)
#   frontend       — Application React via Nginx (port 3000)
#   maildev        — Serveur SMTP de test (SMTP 1025, UI 8025)
#
# Accès rapide après démarrage (~3 min pour le premier build) :
#   Frontend          : http://localhost:3000
#   Keycloak Admin    : http://localhost:8180  (admin / admin)
#   EMPI API          : http://localhost:8081/api/v1/empi
#   GAP  API          : http://localhost:8082/api/v1/gap
#   DPI  API          : http://localhost:8083/api/v1/dpi
#   Tenant API        : http://localhost:8084/api/v1/tenants
#   Les API LIS, RIS et Pharmacie sont exposées via le frontend/gateway.
#   EMPI H2 Console   : http://localhost:8081/h2-console
#   GAP  H2 Console   : http://localhost:8082/h2-console  (profil mock uniquement)
#   DPI  H2 Console   : http://localhost:8083/h2-console  (profil mock uniquement)
#   MailDev UI        : http://localhost:8025
#
# Comptes de test Keycloak (mot de passe : Password1!) :
#   dr.dupont         — rôle MEDECIN
#   inf.martin        — rôle INFIRMIER
#   admin.gap         — rôle ADMIN_GAP
#   biologiste.petit  — rôle BIOLOGISTE
#   pharmacien.durand — rôle PHARMACIEN
#   admin.system      — tous les rôles
#
# Pour démarrer uniquement les services backend sans le frontend :
#   docker compose -f infrastructure/docker/docker-compose.dev.yml up --build \
#     keycloak empi-service gap-service dpi-service tenant-service lis-service ris-service pharmacy-service api-gateway
# ============================================================================

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Base de données Keycloak
  # ──────────────────────────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: ehealth-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Keycloak 26 — IAM / SSO
  # Le realm ehealth est importé automatiquement depuis infrastructure/keycloak/realms/
  # au premier démarrage du container (volume monté en lecture seule).
  # ──────────────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ehealth-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8180/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # EMPI Service — Mock EMPI (H2 in-memory, profil mock)
  # Pas de dépendance à Keycloak : l'EMPI est un service interne non exposé
  # aux utilisateurs finaux, il n'a pas de sécurité OAuth2 en dev.
  # ──────────────────────────────────────────────────────────────────────────
  empi-service:
    build:
      context: ../..
      dockerfile: services/java/empi-service/Dockerfile
      additional_contexts:
        certs: ./cert
      network: host
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    container_name: ehealth-empi
    environment:
      SPRING_PROFILES_ACTIVE: mock
      SERVER_PORT: 8081
      LOGGING_FILE_PATH: /app/logs
      EMPI_MATCHING_SIMILARITY_THRESHOLD: "0.85"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # GAP Service — Module I (H2 in-memory, profil secure)
  # Dépend de l'EMPI pour la déduplication des identités patients,
  # et de Keycloak pour la validation des JWT Bearer.
  # ──────────────────────────────────────────────────────────────────────────
  gap-service:
    build:
      context: ../..
      dockerfile: services/java/gap-service/Dockerfile
      additional_contexts:
        certs: ./cert
      network: host
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    container_name: ehealth-gap
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8082
      LOGGING_FILE_PATH: /app/logs
      # URL EMPI interne (résolution Docker DNS)
      EMPI_SERVICE_URL: http://empi-service:8081
      # Keycloak — Resource Server JWT
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ehealth
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    ports:
      - "8082:8082"
    depends_on:
      empi-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # DPI Service — Module II (H2 in-memory, profil secure)
  # Dépend du GAP pour valider les admissions avant l'ouverture d'un dossier
  # clinique, et de Keycloak pour la validation des JWT Bearer.
  # ──────────────────────────────────────────────────────────────────────────
  dpi-service:
    build:
      context: ../..
      dockerfile: services/java/dpi-service/Dockerfile
      additional_contexts:
        certs: ./cert
      network: host
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    container_name: ehealth-dpi
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8083
      LOGGING_FILE_PATH: /app/logs
      # URL GAP interne
      GAP_SERVICE_URL: http://gap-service:8082
      # Keycloak — Resource Server JWT
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ehealth
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    depends_on:
      gap-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Tenant Service — Multi-tenant admin (H2 in-memory, profil secure)
  # Dépend de Keycloak pour la validation JWT et l'Admin API (groupes).
  # ──────────────────────────────────────────────────────────────────────────
  tenant-service:
    build:
      context: ../..
      dockerfile: services/java/tenant-service/Dockerfile
      additional_contexts:
        certs: ./cert
      network: host
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    container_name: ehealth-tenant
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8084
      LOGGING_FILE_PATH: /app/logs
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ehealth
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8084:8084"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # LIS Service — Module III / Laboratoire et banque de sang
  # Isolé par tenant ; accessible uniquement à travers api-gateway.
  # ──────────────────────────────────────────────────────────────────────────
  lis-service:
    build:
      context: ../..
      dockerfile: services/java/lis-service/Dockerfile
    container_name: ehealth-lis
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8085
      LOGGING_FILE_PATH: /app/logs
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    expose:
      - "8085"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # RIS Service — Module III / Radiologie
  # ──────────────────────────────────────────────────────────────────────────
  ris-service:
    build:
      context: ../..
      dockerfile: services/java/ris-service/Dockerfile
    container_name: ehealth-ris
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8086
      LOGGING_FILE_PATH: /app/logs
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    expose:
      - "8086"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Pharmacy Service — Module IV / Pharmacie et stocks
  # ──────────────────────────────────────────────────────────────────────────
  pharmacy-service:
    build:
      context: ../..
      dockerfile: services/java/pharmacy-service/Dockerfile
    container_name: ehealth-pharmacy
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8087
      LOGGING_FILE_PATH: /app/logs
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    expose:
      - "8087"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network


  # ──────────────────────────────────────────────────────────────────────────
  # RCM Service — Module V / Facturation, caisse et tiers payant
  # Isolé par tenant ; accessible uniquement à travers api-gateway.
  # ──────────────────────────────────────────────────────────────────────────
  rcm-service:
    build:
      context: ../..
      dockerfile: services/java/rcm-service/Dockerfile
    container_name: ehealth-rcm
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8088
      LOGGING_FILE_PATH: /app/logs
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    expose:
      - "8088"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # HR Service — Module VI / personnel, accréditations et plannings
  # Isolé par tenant ; accessible uniquement à travers api-gateway.
  # ──────────────────────────────────────────────────────────────────────────
  hr-service:
    build:
      context: ../..
      dockerfile: services/java/hr-service/Dockerfile
    container_name: ehealth-hr
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8089
      LOGGING_FILE_PATH: /app/logs
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    expose:
      - "8089"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8089/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Support Service — Module VII / restauration, maintenance et bio-nettoyage
  # ──────────────────────────────────────────────────────────────────────────
  support-service:
    build:
      context: ../..
      dockerfile: services/java/support-service/Dockerfile
    container_name: ehealth-support
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8090
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/ehealth/protocol/openid-connect/certs
    expose:
      - "8090"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Patient Portal Service — Module VIII / rendez-vous et téléconsultation
  # ──────────────────────────────────────────────────────────────────────────
  patient-portal-service:
    build:
      context: ../..
      dockerfile: services/java/patient-portal-service/Dockerfile
    container_name: ehealth-patient-portal
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8091
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Analytics Service — Module IX / indicateurs de pilotage tenant-isolés
  # ──────────────────────────────────────────────────────────────────────────
  analytics-service:
    build:
      context: ../..
      dockerfile: services/java/analytics-service/Dockerfile
    container_name: ehealth-analytics
    environment:
      SPRING_PROFILES_ACTIVE: secure
      SERVER_PORT: 8092
    expose:
      - "8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8092/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # API Gateway — Résolution JWT et propagation contrôlée du tenant
  # ──────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../../services/nodejs/api-gateway
      dockerfile: Dockerfile
    container_name: ehealth-api-gateway
    environment:
      PORT: 3000
      EMPI_SERVICE_URL: http://empi-service:8081
      GAP_SERVICE_URL: http://gap-service:8082
      DPI_SERVICE_URL: http://dpi-service:8083
      TENANT_SERVICE_URL: http://tenant-service:8084
      LIS_SERVICE_URL: http://lis-service:8085
      RIS_SERVICE_URL: http://ris-service:8086
      PHARMACY_SERVICE_URL: http://pharmacy-service:8087
      RCM_SERVICE_URL: http://rcm-service:8088
      HR_SERVICE_URL: http://hr-service:8089
      SUPPORT_SERVICE_URL: http://support-service:8090
      PORTAL_SERVICE_URL: http://patient-portal-service:8091
      ANALYTICS_SERVICE_URL: http://analytics-service:8092
    expose:
      - "3000"
    depends_on:
      tenant-service:
        condition: service_healthy
      lis-service:
        condition: service_healthy
      ris-service:
        condition: service_healthy
      pharmacy-service:
        condition: service_healthy
      rcm-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      patient-portal-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend React — Nginx avec proxy inverse vers les backends
  # Les variables VITE_* sont injectées au moment du build Docker (build-time).
  # Nginx proxifie /api/v1/empi → empi-service:8081
  #                /api/v1/gap  → gap-service:8082
  #                /api/v1/dpi  → dpi-service:8083
  #                /api/v1/tenants → tenant-service:8084
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      additional_contexts:
        certs: ./cert
      network: host
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - VITE_AUTH_ENABLED=true
        - VITE_KEYCLOAK_URL=http://localhost:8180
        - VITE_KEYCLOAK_REALM=ehealth
        - VITE_KEYCLOAK_CLIENT_ID=ehealth-frontend
        - VITE_GAP_API_URL=/api/v1/gap
        - VITE_DPI_API_URL=/api/v1/dpi
        - VITE_EMPI_API_URL=/api/v1/empi
        - VITE_LIS_API_URL=/api/v1/lis
        - VITE_RIS_API_URL=/api/v1/ris
        - VITE_PHARMACY_API_URL=/api/v1/pharmacy
        - VITE_RCM_API_URL=/api/v1/rcm
        - VITE_HR_API_URL=/api/v1/hr
        - VITE_SUPPORT_API_URL=/api/v1/support
        - VITE_PORTAL_API_URL=/api/v1/portal
        - VITE_ANALYTICS_API_URL=/api/v1/analytics
    container_name: ehealth-frontend
    ports:
      - "3000:80"
    depends_on:
      empi-service:
        condition: service_healthy
      gap-service:
        condition: service_healthy
      dpi-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ehealth-network

  # ──────────────────────────────────────────────────────────────────────────
  # MailDev — Serveur SMTP de test
  # Capture tous les emails sortants sans les envoyer réellement.
  # SMTP : localhost:1025  |  Interface web : http://localhost:8025
  # ──────────────────────────────────────────────────────────────────────────
  maildev:
    image: maildev/maildev:2.1.0
    container_name: ehealth-maildev
    ports:
      - "1025:1025"   # SMTP
      - "8025:1080"   # Interface web
    restart: unless-stopped
    networks:
      - ehealth-network

# ============================================================================
# Volumes persistants
# ============================================================================
volumes:
  keycloak_db_data:
    driver: local

# ============================================================================
# Réseau interne partagé entre tous les services
# ============================================================================
networks:
  ehealth-network:
    driver: bridge
    name: ehealth-dev-network
