name: eHealth CI Pipeline

# CI: push / merge sur main (+ release/** pour images consommées par le CD)
on:
  push:
    branches: [main, develop, "release/**", "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop, "release/**"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Check formatting
        run: pnpm format:check
        continue-on-error: true

  build-java:
    name: Build Java Services
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Java build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-build-artifacts
          path: services/java/*/target/
          retention-days: 1

  build-nodejs:
    name: Build Node.js Services
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Node.js services
        run: pnpm build
        continue-on-error: false

      - name: Upload Node.js build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build-artifacts
          path: services/nodejs/*/dist/
          retention-days: 1

  test-java:
    name: Test Java Services
    runs-on: ubuntu-latest
    needs: build-java
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Java tests (mock profile — H2 in-memory)
        run: mvn test -Dspring.profiles.active=mock

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage-reports
          path: services/java/*/target/site/jacoco/
          retention-days: 7

  test-nodejs:
    name: Test Node.js Services
    runs-on: ubuntu-latest
    needs: build-nodejs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Node.js tests
        run: pnpm test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-coverage-reports
          path: coverage/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-java, build-nodejs]
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # Contabo images — published on main + release/** (consumed by CD)
  build-contabo-images:
    name: Build Contabo Docker Images
    runs-on: ubuntu-latest
    needs: [test-java, test-nodejs, security-scan]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Ensure certs context exists
        run: |
          if [ ! -f infrastructure/docker/cert/ZscalerRootCA.pem ]; then
            echo "ERROR: infrastructure/docker/cert/ZscalerRootCA.pem missing" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push EMPI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/java/empi-service/Dockerfile
          build-contexts: |
            certs=infrastructure/docker/cert
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-empi:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-empi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GAP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/java/gap-service/Dockerfile
          build-contexts: |
            certs=infrastructure/docker/cert
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-gap:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-gap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push DPI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/java/dpi-service/Dockerfile
          build-contexts: |
            certs=infrastructure/docker/cert
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-dpi:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-dpi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Tenant
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/java/tenant-service/Dockerfile
          build-contexts: |
            certs=infrastructure/docker/cert
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-tenant:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-tenant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-contexts: |
            certs=${{ github.workspace }}/infrastructure/docker/cert
          build-args: |
            VITE_AUTH_ENABLED=true
            VITE_KEYCLOAK_URL=https://auth.optimizesolux.com
            VITE_KEYCLOAK_REALM=ehealth
            VITE_KEYCLOAK_CLIENT_ID=ehealth-frontend
            VITE_GAP_API_URL=/api/v1/gap
            VITE_DPI_API_URL=/api/v1/dpi
            VITE_EMPI_API_URL=/api/v1/empi
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [lint-and-format, build-java, build-nodejs, test-java, test-nodejs, security-scan]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-and-format.result }}" == "failure" ] || \
             [ "${{ needs.build-java.result }}" == "failure" ] || \
             [ "${{ needs.build-nodejs.result }}" == "failure" ] || \
             [ "${{ needs.test-java.result }}" == "failure" ] || \
             [ "${{ needs.test-nodejs.result }}" == "failure" ]; then
            echo "Pipeline failed"
            exit 1
          fi
          echo "Pipeline succeeded"
